[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-db-threads"
version = "0.0.1"
description = "Run database work off the Evennia reactor without leaving connections behind on the worker thread"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
dependencies = [
    "evennia",
    "evennia-logging-extension",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_db_threads*"]
